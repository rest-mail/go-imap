name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache: true

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.25.0 (go.mod). Pin a build made with Go >= 1.25.
          version: v2.11.4
          args: --timeout=5m

      - name: Validate partial RFC checklist
        run: go run ./internal/checklist internal/rfctest

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      # Duration limits can fail at normal shutdown with "context deadline exceeded"
      # (golang/go#75804). Bound each smoke run by executions instead; failures
      # still propagate through go test without retries or suppressed errors.
      - name: Fuzz MIME transfer-encoding token
        run: go test -run=^$ -fuzz=^FuzzTransferEncoding$ -fuzztime=500000x .

      - name: Fuzz Content-Type comments
        run: go test -run='^$' -fuzz='^FuzzContentTypeComments$' -fuzztime=500000x .

      - name: Fuzz FETCH partial ranges
        run: go test -run='^$' -fuzz='^FuzzBodyPartial$' -fuzztime=500000x .

      - name: Fuzz FETCH data-item lists
        run: go test -run='^$' -fuzz='^FuzzFetchItems$' -fuzztime=500000x .

      - name: Fuzz FETCH header lists
        run: go test -run='^$' -fuzz='^FuzzHeaderFields$' -fuzztime=500000x .

      - name: Fuzz FETCH section-specs
        run: go test -run='^$' -fuzz='^FuzzSectionSpec$' -fuzztime=500000x .

      - name: Fuzz SEARCH date tokens
        run: go test -run='^$' -fuzz='^FuzzSearchDate$' -fuzztime=500000x .

      - name: Fuzz SEARCH quote framing
        run: go test -run='^$' -fuzz='^FuzzSearchQuotes$' -fuzztime=500000x .
